<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NossoCasamento · mockup da casa</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --wine: #7a3e48;
      --ink: #2a1c18;
      --gold: #c4a574;
      --cream: #f4ece4;
      --paper: #fffdf8;
      --mute: #6b5344;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: #1c1714;
      color: var(--cream);
      font-family: Outfit, system-ui, sans-serif;
      display: grid;
      grid-template-columns: 280px 1fr 260px;
      min-height: 100svh;
    }
    a { color: inherit; text-decoration: none; }
    button, input, select { font: inherit; }
    button { cursor: pointer; border: 0; background: 0; color: inherit; }
    aside { padding: 28px 22px; overflow: auto; }
    .kicker {
      letter-spacing: .26em;
      text-transform: uppercase;
      font-size: 11px;
      color: var(--gold);
      margin-bottom: 10px;
    }
    h1 {
      font-family: "Cormorant Garamond", serif;
      font-style: italic;
      font-weight: 400;
      font-size: 28px;
      line-height: 1.15;
      margin-bottom: 18px;
    }
    .map button, .notes li {
      display: block;
      width: 100%;
      text-align: left;
      padding: 10px 12px;
      border-radius: 10px;
      color: rgba(244,236,228,.72);
      font-size: 14px;
      font-weight: 300;
    }
    .map button:hover { background: rgba(255,255,255,.05); color: #fff; }
    .map button.on { background: rgba(196,165,116,.18); color: #fff; }
    .map .g {
      margin: 16px 0 8px;
      font-size: 11px;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: #8a746c;
    }
    .stage {
      display: grid;
      place-items: center;
      padding: 24px 12px 32px;
    }
    .phone {
      width: 390px;
      height: 844px;
      max-height: calc(100svh - 48px);
      background: var(--paper);
      color: var(--ink);
      border-radius: 36px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 40px 80px rgba(0,0,0,.45);
      display: flex;
      flex-direction: column;
    }
    .phone.dark { background: #111; color: #fff; }
    .notch {
      height: 28px;
      flex: 0 0 28px;
      display: grid;
      place-items: center;
      font-size: 11px;
      letter-spacing: .08em;
      color: var(--mute);
    }
    .phone.dark .notch { color: rgba(255,255,255,.5); }
    .scroll {
      flex: 1;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
    }
    .phone.dark .scroll { background: #111; }
    .tabbar {
      flex: 0 0 64px;
      display: flex;
      border-top: 1px solid rgba(122,62,72,.12);
      background: #fff;
    }
    .tabbar button {
      flex: 1;
      font-size: 11px;
      color: rgba(42,28,24,.45);
      padding-top: 8px;
    }
    .tabbar button.on { color: var(--wine); font-weight: 500; }
    .tabbar b { display: block; font-size: 16px; font-weight: 400; margin-bottom: 2px; }
    .hero {
      position: relative;
      min-height: 420px;
      color: #fff;
    }
    .hero img, .cover img {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    }
    .hero .shade {
      position: absolute; inset: 0;
      background: linear-gradient(transparent 20%, rgba(12,8,6,.88));
    }
    .hero .copy {
      position: relative; z-index: 1;
      padding: 240px 24px 28px;
    }
    .serif {
      font-family: "Cormorant Garamond", serif;
      font-style: italic;
      font-weight: 400;
    }
    .gold { color: var(--gold); }
    .wine { color: var(--wine); }
    .mute { color: var(--mute); font-weight: 300; }
    .pad { padding: 20px 22px 28px; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--gold);
      color: var(--ink);
      border-radius: 999px;
      padding: 14px 22px;
      font-weight: 500;
      width: 100%;
    }
    .btn.ghost {
      background: transparent;
      border: 1px solid rgba(255,255,255,.55);
      color: #fff;
    }
    .btn.wine { background: var(--wine); color: #fff; }
    .btn.slim { width: auto; padding: 10px 16px; font-size: 14px; }
    .card {
      background: #fff;
      border: 1px solid #eadfD2;
      border-radius: 16px;
      padding: 16px;
      margin-top: 12px;
    }
    .statrow { display: flex; gap: 10px; }
    .statrow .card { flex: 1; text-align: center; margin-top: 0; }
    .statrow strong { display: block; font-size: 22px; }
    .flash { outline: 2px solid var(--gold); animation: pulse 1.2s ease 2; }
    @keyframes pulse { 50% { outline-color: var(--wine); } }
    .toast {
      position: absolute;
      left: 16px; right: 16px; top: 36px;
      background: var(--ink);
      color: var(--cream);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 14px;
      z-index: 5;
    }
    .stepdot { display: flex; gap: 6px; margin: 8px 0 18px; }
    .stepdot i { width: 28px; height: 4px; border-radius: 99px; background: #eadfd2; }
    .stepdot i.on { background: var(--wine); }
    label { display: block; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); margin: 14px 0 6px; }
    input, select {
      width: 100%;
      border: 1px solid #eadfd2;
      border-radius: 12px;
      padding: 12px 14px;
      background: #fff;
      color: var(--ink);
    }
    .faces { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .faces button {
      border-radius: 12px;
      overflow: hidden;
      height: 92px;
      position: relative;
      border: 2px solid transparent;
    }
    .faces button.on { border-color: var(--gold); }
    .faces img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .faces span {
      position: absolute; left: 8px; bottom: 6px; color: #fff; font-size: 12px;
      text-shadow: 0 1px 4px #000;
    }
    .guest {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 0; border-bottom: 1px solid #eadfd2;
    }
    .pill {
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
      border-radius: 99px;
      padding: 4px 8px;
      background: #eadfd2;
    }
    .pill.yes { background: #dce8dc; color: #2d4a2d; }
    .pill.wait { background: #f3e6c8; color: #6a4e1f; }
    .task { display: flex; gap: 12px; padding: 14px 0; border-bottom: 1px dashed #eadfd2; }
    .task i {
      width: 22px; height: 22px; border-radius: 50%;
      border: 1.5px solid var(--wine); flex: 0 0 22px; margin-top: 2px;
    }
    .task.done i { background: var(--wine); }
    .task.done p { text-decoration: line-through; color: var(--mute); }
    .notes { font-size: 14px; font-weight: 300; color: rgba(244,236,228,.7); line-height: 1.55; }
    .notes h2 {
      font-family: "Cormorant Garamond", serif;
      font-style: italic;
      font-size: 22px;
      color: #fff;
      margin: 8px 0 10px;
    }
    .notes li { padding: 6px 0; list-style: none; }
    .band { padding: 22px; border-top: 1px solid #eadfd2; }
    .band h3 { font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); margin-bottom: 6px; }
    .warn {
      background: #f8efe0;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 14px;
      margin-top: 12px;
    }
    .lock { font-size: 13px; color: var(--mute); margin-top: 10px; }
    @media (max-width: 1100px) {
      body { grid-template-columns: 1fr; }
      aside:last-child { display: none; }
      aside:first-child { padding-bottom: 8px; }
      .stage { padding: 0 0 24px; }
    }
  </style>
</head>
<body>
  <aside>
    <p class="kicker">Mockup · não é o site ainda</p>
    <h1>Como o casal anda sem pensar.</h1>
    <p style="font-size:13px;font-weight:300;color:rgba(244,236,228,.55);margin:0 0 16px;line-height:1.5">
      <a href="concorrentes-casamento-infographic.png" target="_blank" style="color:#c4a574">Infográfico dos concorrentes</a>
    </p>
    <div class="map" id="map"></div>
  </aside>

  <main class="stage">
    <div class="phone" id="phone">
      <div class="notch">9:41</div>
      <div class="scroll" id="view"></div>
      <nav class="tabbar" id="tabs" hidden></nav>
      <div class="toast" id="toast" hidden></div>
    </div>
  </main>

  <aside class="notes" id="notes"></aside>

  <script>
    const F = "../fotos/";
    const S = {
      screen: "rua",
      step: 0,
      p1: "Marina",
      p2: "Thiago",
      date: "2027-08-14",
      city: "São Paulo",
      guests: 120,
      budget: 180000,
      rsvpYes: 42,
      rsvpNo: 3,
      rsvpWait: 75,
      perHead: 280,
      assessora: false,
      face: "jardim",
      toast: "",
      flash: false,
      primo: false,
    };

    const MAP = [
      { g: "Rua" },
      { id: "rua", t: "Home nova" },
      { id: "criar", t: "90 segundos" },
      { id: "convidado", t: "Site do primo" },
      { g: "Vocês" },
      { id: "hoje", t: "Hoje" },
      { id: "site", t: "Site" },
      { id: "gente", t: "Gente" },
      { id: "grana", t: "Grana" },
      { id: "tarefas", t: "Tarefas" },
      { id: "mais", t: "Mais · equipe" },
      { g: "Assessoria" },
      { id: "assessora", t: "Cadeira dela" },
    ];

    const NOTES = {
      rua: ["Três faixas, nessa ordem.", "Site do convidado.", "Relógio no e-mail.", "Cadeira da assessora.", "Preço só depois."],
      criar: ["Bridebook: conversa, não formulário.", "Site nasce de brinde.", "Parceiro entra no dia 1."],
      convidado: ["Uma pergunta. RSVP. PIX.", "Não vê o painel do casal."],
      hoje: ["Uma frase. Um botão dourado.", "RSVP em número. Teto em reais.", "O resto some."],
      site: ["O editor continua. Só não é a home."],
      gente: ["Clique no primo. Número sobe.", "Buffet sobe junto. Joy, no PIX."],
      grana: ["Teto pisca quando o RSVP muda.", "Assessora não entra aqui."],
      tarefas: ["Data manda na lista.", "E-mail e WhatsApp da semana."],
      mais: ["Convite da assessora.", "Ela cria tarefa. Não saca PIX."],
      assessora: ["Mesmo casamento. Sem a chave.", "Roteiro do dia no mesmo papel."],
    };

    const COUPLE = new Set(["hoje","site","gente","grana","tarefas","mais"]);

    function money(n) {
      return "R$ " + n.toLocaleString("pt-BR");
    }
    function months() { return 11; }
    function buffet() { return S.rsvpYes * S.perHead; }
    function go(id) {
      S.screen = id;
      draw();
    }
    function toast(msg) {
      S.toast = msg;
      draw();
      setTimeout(() => { S.toast = ""; draw(); }, 2600);
    }
    function confirmPrimo() {
      if (S.rsvpWait <= 0) return;
      S.rsvpYes += 1;
      S.rsvpWait -= 1;
      S.primo = true;
      S.flash = true;
      toast("Primo confirmou. Buffet +" + money(S.perHead) + ". Teto piscou.");
      setTimeout(() => { S.flash = false; draw(); }, 1800);
    }
    function invite() {
      S.assessora = true;
      toast("Helena sentou neste casamento. Sem ver o PIX.");
      go("assessora");
    }

    function mapHtml() {
      return MAP.map((x) => x.g
        ? `<p class="g">${x.g}</p>`
        : `<button class="${S.screen===x.id?"on":""}" data-go="${x.id}">${x.t}</button>`
      ).join("");
    }

    function tabsHtml() {
      const items = [
        ["hoje","Hoje","⌂"],
        ["site","Site","◇"],
        ["gente","Gente","☺"],
        ["grana","Grana","R$"],
        ["mais","Mais","…"],
      ];
      return items.map(([id,l,i]) =>
        `<button class="${S.screen===id||(id==="mais"&&(S.screen==="tarefas"||S.screen==="mais"))?"on":""}" data-go="${id}"><b>${i}</b>${l}</button>`
      ).join("");
    }

    function rua() {
      return `
        <div class="hero">
          <img src="${F}ensaio.jpg" alt="" />
          <div class="shade"></div>
          <div class="copy">
            <p class="kicker gold">O convite que o primo abre</p>
            <h2 class="serif" style="font-size:42px;line-height:1.05">Vocês no centro da página.</h2>
            <p class="mute" style="color:rgba(255,255,255,.8);margin:12px 0 18px">Site, RSVP e PIX. Depois o relógio. Depois a cadeira da assessora.</p>
            <button class="btn" data-go="criar">Começar em 90 segundos</button>
            <button class="btn ghost" style="margin-top:8px" data-go="convidado">Abrir o site do convidado</button>
          </div>
        </div>
        <div class="band">
          <h3>01 · o site</h3>
          <p class="serif" style="font-size:26px">O primo abre e já entende o dia.</p>
        </div>
        <div class="band">
          <h3>02 · o relógio</h3>
          <p class="serif" style="font-size:26px">Toda semana, uma tarefa no WhatsApp.</p>
        </div>
        <div class="band">
          <h3>03 · a cadeira</h3>
          <p class="serif" style="font-size:26px">A assessora senta no casamento. Não numa vitrine.</p>
        </div>
      `;
    }

    function criar() {
      const steps = [
        {
          t: "Como vocês se chamam?",
          b: `
            <label>Noiva</label><input id="p1" value="${S.p1}" />
            <label>Noivo</label><input id="p2" value="${S.p2}" />
            <p class="lock">O parceiro entra agora. Hitched pede isso no cadastro.</p>
          `
        },
        {
          t: "Quando e onde?",
          b: `
            <label>Data</label><input id="date" type="date" value="${S.date}" />
            <label>Cidade</label><input id="city" value="${S.city}" />
          `
        },
        {
          t: "Quantos. Quanto.",
          b: `
            <label>Convidados</label><input id="guests" type="number" value="${S.guests}" />
            <label>Teto</label><input id="budget" type="number" value="${S.budget}" />
            <p class="lock">A lista nasce da data. Sem cadastro no meio.</p>
          `
        },
        {
          t: "Que cara tem o dia?",
          b: `
            <div class="faces">
              <button data-face="jardim" class="${S.face==="jardim"?"on":""}"><img src="${F}jardim.jpg" alt="" /><span>Jardim</span></button>
              <button data-face="noite" class="${S.face==="noite"?"on":""}"><img src="${F}altar.jpg" alt="" /><span>Noite</span></button>
              <button data-face="papel" class="${S.face==="papel"?"on":""}"><img src="${F}flores.jpg" alt="" /><span>Papel</span></button>
              <button data-face="costa" class="${S.face==="costa"?"on":""}"><img src="${F}beijo.jpg" alt="" /><span>Costa</span></button>
            </div>
          `
        },
      ];
      const s = steps[S.step];
      const last = S.step === 3;
      return `
        <div class="pad">
          <p class="kicker wine">Passo ${S.step+1} de 4</p>
          <div class="stepdot">${[0,1,2,3].map(i=>`<i class="${i<=S.step?"on":""}"></i>`).join("")}</div>
          <h2 class="serif" style="font-size:34px">${s.t}</h2>
          ${s.b}
          <button class="btn" style="margin-top:22px" id="next">${last ? "Abrir o Hoje" : "Continuar"}</button>
        </div>
      `;
    }

    function hoje() {
      return `
        <div class="pad">
          <p class="kicker wine">${S.p1} & ${S.p2}</p>
          <p class="mute">faltam ${months()} meses · ${S.city}</p>
          <h2 class="serif" style="font-size:36px;margin:10px 0 8px">Fechem o espaço.</h2>
          <p class="mute">Igreja e salão somem primeiro no calendário de São Paulo. Uma ação. O resto espera.</p>
          <button class="btn" style="margin-top:18px" data-go="tarefas">Marcar como feito</button>
          <div class="statrow" style="margin-top:18px">
            <div class="card"><span class="mute">Disseram sim</span><strong>${S.rsvpYes}</strong></div>
            <div class="card ${S.flash?"flash":""}"><span class="mute">Teto</span><strong>${money(S.budget)}</strong></div>
          </div>
          <div class="warn">Buffet estimado hoje: ${money(buffet())} · ${S.rsvpYes} × ${money(S.perHead)}</div>
        </div>
      `;
    }

    function site() {
      return `
        <div class="cover" style="position:relative;height:280px;color:#fff">
          <img src="${F}${S.face==="noite"?"altar.jpg":S.face==="papel"?"flores.jpg":S.face==="costa"?"beijo.jpg":"jardim.jpg"}" alt="" />
          <div class="shade" style="position:absolute;inset:0;background:linear-gradient(transparent,rgba(0,0,0,.7))"></div>
          <div style="position:relative;padding:170px 22px 20px">
            <p class="kicker gold">O site</p>
            <h2 class="serif" style="font-size:36px">${S.p1} & ${S.p2}</h2>
          </div>
        </div>
        <div class="pad">
          <p class="mute">Modelo ${S.face}. O editor continua aqui. Não é mais a porta da frente.</p>
          <button class="btn slim" style="margin-top:14px" data-go="convidado">Ver como o primo vê</button>
        </div>
      `;
    }

    function gente() {
      return `
        <div class="pad">
          <p class="kicker wine">Gente</p>
          <h2 class="serif" style="font-size:32px">${S.rsvpYes} sim · ${S.rsvpWait} calados</h2>
          <p class="mute">Quando o primo confirma, o buffet sobe sozinho.</p>
          <div class="guest"><span>Helena Costa</span><span class="pill yes">sim</span></div>
          <div class="guest"><span>Rafael Lima</span><span class="pill wait">espera</span></div>
          <div class="guest">
            <span>Primo João</span>
            ${S.primo ? `<span class="pill yes">sim</span>` : `<button class="btn slim" id="primo">Ele confirmou</button>`}
          </div>
          <div class="guest"><span>Tia Lúcia</span><span class="pill yes">sim + 2</span></div>
          <div class="warn">Cada sim puxa ${money(S.perHead)} no teto. Joy faz isso. Vocês já têm o RSVP — falta empurrar a grana.</div>
        </div>
      `;
    }

    function grana() {
      const used = buffet() + 42000;
      const pct = Math.min(100, Math.round(used / S.budget * 100));
      return `
        <div class="pad">
          <p class="kicker wine">Grana</p>
          <h2 class="serif" style="font-size:32px">${money(S.budget)}</h2>
          <p class="mute">Teto de vocês. ${pct}% já no papel, contando quem disse sim.</p>
          <div class="card ${S.flash?"flash":""}">
            <p class="mute">Buffet · ${S.rsvpYes} confirmações</p>
            <strong style="font-size:24px">${money(buffet())}</strong>
          </div>
          <div class="card">
            <p class="mute">Igreja + papel + foto (faixa 2026)</p>
            <strong>R$ 42.000</strong>
          </div>
          <div class="card">
            <p class="mute">PIX recebido</p>
            <strong>R$ 3.480</strong>
            <p class="lock">A assessora não vê esta linha.</p>
          </div>
          <button class="btn" style="margin-top:16px" data-go="gente">Ver quem falta</button>
        </div>
      `;
    }

    function tarefas() {
      return `
        <div class="pad">
          <p class="kicker wine">Setembro 2026 · faltam ${months()} meses</p>
          <h2 class="serif" style="font-size:32px">Esta semana</h2>
          <div class="task"><i></i><div><strong>Fechar o espaço</strong><p class="mute">WhatsApp amanhã, 9h. Bruiloft.nl já faz isso.</p></div></div>
          <div class="task"><i></i><div><strong>Pedir três orçamentos de buffet</strong><p class="mute">Cola o nome. Sem vitrine de 70 mil.</p></div></div>
          <div class="task done"><i></i><div><p>Escolher a cara do site</p></div></div>
          <p class="lock" style="margin-top:16px">Tarefa sem mês some. Data manda.</p>
        </div>
      `;
    }

    function mais() {
      return `
        <div class="pad">
          <p class="kicker wine">Mais</p>
          <h2 class="serif" style="font-size:32px">Equipe</h2>
          <div class="card">
            <strong>Helena, assessora</strong>
            <p class="mute">${S.assessora ? "Sentou. Vê tarefas e roteiro. Não vê PIX." : "Ainda de fora. Um link. Ela entra neste casamento, não numa vitrine."}</p>
            ${S.assessora
              ? `<button class="btn slim" style="margin-top:12px" data-go="assessora">Abrir a cadeira dela</button>`
              : `<button class="btn slim" style="margin-top:12px" id="invite">Mandar o convite</button>`}
          </div>
          <div class="card"><strong>Domínio</strong><p class="mute">marinaethiago.com — como hoje.</p></div>
          <div class="card"><strong>Arquivo</strong><p class="mute">Depois da festa: contratos, recados, fotos dos convidados.</p></div>
          <button class="btn" style="margin-top:16px;background:transparent;border:1px solid #eadfd2" data-go="tarefas">Abrir as tarefas</button>
        </div>
      `;
    }

    function assessora() {
      return `
        <div class="pad">
          <p class="kicker wine">Helena · assessoria</p>
          <h2 class="serif" style="font-size:32px">${S.p1} & ${S.p2}</h2>
          <p class="mute">14 ago 2027 · São Paulo. Você foi convidada. Sem a chave do dinheiro.</p>
          <div class="card">
            <strong>Roteiro do dia</strong>
            <p class="mute">15h maquiagem · 17h igreja · 20h festa. O mesmo papel do casal. Appy / draaiboek holandês.</p>
          </div>
          <div class="card">
            <strong>Tarefas que você criou</strong>
            <p class="mute">Confirmar florista · prova do menu. O casal marca feito.</p>
          </div>
          <div class="card">
            <strong>RSVP ao vivo</strong>
            <p class="mute">${S.rsvpYes} sim. Zexy: a profissional vê a lista. Não o PIX.</p>
          </div>
          <p class="lock">Bloqueado: chave PIX, saque, teto em reais.</p>
        </div>
      `;
    }

    function convidado() {
      return `
        <div class="cover" style="position:relative;min-height:360px;color:#fff">
          <img src="${F}ensaio.jpg" alt="" />
          <div class="shade" style="position:absolute;inset:0;background:linear-gradient(transparent,rgba(0,0,0,.75))"></div>
          <div style="position:relative;padding:220px 22px 24px">
            <p class="kicker gold">14 · 08 · 2027</p>
            <h2 class="serif" style="font-size:40px">${S.p1} & ${S.p2}</h2>
          </div>
        </div>
        <div class="pad">
          <p class="mute">Você é o primo. Uma pergunta.</p>
          <button class="btn wine" id="primo">Sim, estarei lá</button>
          <button class="btn" style="margin-top:8px;background:#eadfd2">Presentear no PIX</button>
        </div>
      `;
    }

    const VIEWS = { rua, criar, hoje, site, gente, grana, tarefas, mais, assessora, convidado };

    function bindCriar() {
      const next = document.getElementById("next");
      if (!next) return;
      next.onclick = () => {
        S.p1 = (document.getElementById("p1")||{}).value || S.p1;
        S.p2 = (document.getElementById("p2")||{}).value || S.p2;
        S.date = (document.getElementById("date")||{}).value || S.date;
        S.city = (document.getElementById("city")||{}).value || S.city;
        S.guests = Number((document.getElementById("guests")||{}).value) || S.guests;
        S.budget = Number((document.getElementById("budget")||{}).value) || S.budget;
        if (S.step < 3) { S.step += 1; draw(); }
        else go("hoje");
      };
    }

    function draw() {
      document.getElementById("map").innerHTML = mapHtml();
      document.getElementById("view").innerHTML = (VIEWS[S.screen]||rua)();
      document.getElementById("notes").innerHTML = `<p class="kicker">Nesta tela</p><h2>${MAP.find(x=>x.id===S.screen)?.t||""}</h2><ul>${(NOTES[S.screen]||[]).map(n=>`<li>· ${n}</li>`).join("")}</ul>`;
      const tabs = document.getElementById("tabs");
      const couple = COUPLE.has(S.screen);
      tabs.hidden = !couple;
      tabs.innerHTML = couple ? tabsHtml() : "";
      document.getElementById("phone").classList.toggle("dark", S.screen==="rua"||S.screen==="convidado");
      const t = document.getElementById("toast");
      t.hidden = !S.toast;
      t.textContent = S.toast;
      bindCriar();
      document.getElementById("primo")?.addEventListener("click", confirmPrimo);
      document.getElementById("invite")?.addEventListener("click", invite);
    }

    document.body.addEventListener("click", (e) => {
      const goEl = e.target.closest("[data-go]");
      if (goEl) go(goEl.getAttribute("data-go"));
      const face = e.target.closest("[data-face]");
      if (face) { S.face = face.getAttribute("data-face"); draw(); }
    });

    draw();
  </script>
</body>
</html>
